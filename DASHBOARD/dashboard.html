<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style/dashboard.css">
    <title>Document</title>
</head>
<body>
    <header id="cabeçalho">
        <div class="logo-area">
            <img src="" alt="Logo - SecureFlow">
            <h2>STATUS DO SISTEMA</h2>
        </div>
        <img src="" alt="">
    </header>

    <main id="dashboard">
        <!-- Coluna da Esquerda -->
        <section class="coluna-esquerda">
            <article class="secao-estado-atual">
                <h3>INTERFACE HARDWARE</h3>
                <p>Mensagens de segurança e controle de temperatura em emergências.</p>

                <div class="card-lcd">
                    <h2>SISTEMA PRONTO</h2>
                    <span>•••</span>
                </div>
                <div class="card-temperatura">
                    <span class="badge">SEGURO</span>
                    <h1>30°C</h1>
                    <div class="grafico"></div>
                </div>
            </article>
            <article>
                <h3>ILUMINAÇÃO & ROTAS DE SAÍDA</h3>
                <p>Controle de iluminação de rotas de saída.</p>
                <div class="icon-grid">
                    <div class="icon-box">
                        <span>LUZES DE SEGURANÇA</span>
                    </div>
                    <div class="icon-box">
                        <span>ROTAS DE SAÍDA</span>
                    </div>
                    <div class="icon-box">
                        <span>LUZES DE ROTA</span>
                    </div>
                    <div class="icon-box">
                        <span>ENERGIA DE EMERGÊNCIA</span>
                    </div>
                </div>
            </article>
        </section>

        <!-- Centro -->
        <section>
            <article class="card-gases"></article>
        </section>

        <!-- Coluna da Direita -->
        <section>
            <h2>ALERTAS MANUAIS</h2>
            <button class="btn-alarme">ACIONAR ALARME LOCAL</button>
            <button class="btn-despacho">✱ CONTATAR DESPACHO</button>
        </section>
    </main>

    <footer></footer>
</body>
</html>
