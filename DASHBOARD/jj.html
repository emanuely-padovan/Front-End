<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFlow Dashboard</title>
    <link rel="stylesheet" href="src/style/jj.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="logo.png" alt="Logo">
            <h2>STATUS DO SISTEMA</h2>
        </div>

        <i class="fa-regular fa-bell"></i>
    </header>

    <main class="dashboard">
        <!-- Centro -->
        <section class="center-column">
            <div class="card gases">
                <h2>ÍNDICE DE PRESENÇA DE GASES NOCIVOS</h2>
                <div class="gas-item">
                    <div class="gas-header">
                        <span>CO2 - Dióxido de Carbono</span>
                        <strong>000 PPM</strong>
                    </div>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                </div>
                <div class="gas-item">
                    <div class="gas-header">
                        <span>CH4 - Metano</span>
                        <strong>000 PPM</strong>
                    </div>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                </div>
                <div class="gas-item">
                    <div class="gas-header">
                        <span>C4H10 - Butano</span>
                        <strong>000 PPM</strong>
                    </div>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                </div>
                <div class="gas-item">
                    <div class="gas-header">
                        <span>C3H8 - Propano</span>
                        <strong>000 PPM</strong>
                    </div>
                    <div class="bar">
                        <div class="fill"></div>
                    </div>
                </div>
            </div>
            <div class="alerts">
                <div class="alert-card">
                    <div class="alert-dot"></div>
                    <h3>ALERTA!</h3>
                    <p>Altos níveis de temperatura no ambiente atual.</p>
                    <span class="critico">CRÍTICO</span>
                </div>
                <div class="alert-card">
                    <div class="alert-dot"></div>
                    <h3>ALERTA!</h3>
                    <p>Altos níveis de gás metano no ambiente atual.</p>
                    <span class="critico">CRÍTICO</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
